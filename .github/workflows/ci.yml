name: CI

# Runs on every push and pull request to main. Do not merge while it is red.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: backend tests and cross-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install app dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Install deck and PDF generator dependencies
        # Kept out of backend/requirements.txt because the app does not need them.
        # The deck test compares the committed .pptx with its generator.
        run: pip install -r docs/competition/requirements.txt

      - name: Run all tests
        run: python -m pytest backend/tests -q

      - name: Check that generated files and their diff tests still exist
        # A deleted test passes silently, so a missing guard or generated file fails here.
        run: |
          fail=0
          for f in contracts/openapi.json \
                   scripts/gen_contracts.py \
                   backend/tests/crosscheck/test_generated_contracts_diff.py \
                   backend/tests/crosscheck/test_generated_frontend_diff.py \
                   frontend/generated/model_constants.js \
                   frontend/generated/policy_rules.js \
                   frontend/generated/regions.js \
                   frontend/generated/contract_constants.js; do
            if [ ! -f "$f" ]; then
              echo "::error::generated file or diff test is missing: $f"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          python -m pytest backend/tests/crosscheck/test_generated_contracts_diff.py \
                           backend/tests/crosscheck/test_generated_frontend_diff.py -q
